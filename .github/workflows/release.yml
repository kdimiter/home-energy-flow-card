name: Release

# Publishes a GitHub release (tag v<VERSION> + the card file as an asset) whenever main
# carries a VERSION that has not been released yet. Bump VERSION + CHANGELOG, push to main.
on:
  push:
    branches: [main]
    paths: ["dist/home-energy-flow-card.js", "CHANGELOG.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Read version
        id: v
        run: |
          v=$(sed -nE "s/^const VERSION = '([0-9]+\.[0-9]+\.[0-9]+)';/\1/p" dist/home-energy-flow-card.js)
          test -n "$v" || { echo "VERSION not found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish release if new
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V already released"; exit 0
          fi
          awk -v h="## $V" 'index($0, h) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "v$V" dist/home-energy-flow-card.js --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
